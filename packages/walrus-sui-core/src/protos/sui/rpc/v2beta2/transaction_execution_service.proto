syntax = "proto3";

import "google/rpc/status.proto";

package sui.rpc.v2beta2;

// Transaction execution request
message ExecuteTransactionRequest {
  bytes transaction = 1;
  string sender = 2;
  bytes signature = 3;
}

// Transaction execution response
message ExecuteTransactionResponse {
  google.rpc.Status status = 1;
  string transaction_digest = 2;
  TransactionEffects effects = 3;
}

// Transaction effects (reusing from subscription_service.proto)
message TransactionEffects {
  google.rpc.Status status = 1;
  GasUsed gas_used = 2;
}

// Gas usage data
message GasUsed {
  uint64 computation_cost = 1;
  uint64 storage_cost = 2;
  uint64 storage_rebate = 3;
}

service TransactionExecutionService {
  rpc ExecuteTransaction(ExecuteTransactionRequest) returns (ExecuteTransactionResponse);
}
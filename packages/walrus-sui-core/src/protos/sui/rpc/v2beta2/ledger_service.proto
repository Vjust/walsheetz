syntax = "proto3";

import "google/rpc/status.proto";

package sui.rpc.v2beta2;

// Get balance request
message GetBalanceRequest {
  string address = 1;
  string coin_type = 2;
}

// Balance response
message GetBalanceResponse {
  google.rpc.Status status = 1;
  Balance balance = 2;
}

// Balance data
message Balance {
  string balance = 1;
  uint32 coin_object_count = 2;
  string locked_balance = 3;
}

// Get owned objects request
message GetOwnedObjectsRequest {
  string address = 1;
  ObjectFilter filter = 2;
}

// Object filter
message ObjectFilter {
  string object_type = 1;
  repeated string options = 2;
}

// Owned objects response
message GetOwnedObjectsResponse {
  google.rpc.Status status = 1;
  repeated Object objects = 2;
  bool has_next_page = 3;
  string next_cursor = 4;
}

// Object data
message Object {
  string object_id = 1;
  string object_type = 2;
  string owner = 3;
  uint64 version = 4;
}

service LedgerService {
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetOwnedObjects(GetOwnedObjectsRequest) returns (GetOwnedObjectsResponse);
}
# Bun configuration for WalSheetz

[install]
# Use the latest compatible versions
peer = true
dev = true
optional = true

[install.cache]
dir = ".bun/cache"
disable = false

[install.lockfile]
save = true
print = "yarn"

[run]
# Enable hot reload for development
hot = true
shell = "bun"

[test]
coverage = true
coverageThreshold = 80

[bundle]
minify = true
sourcemap = "external"
target = "browser"

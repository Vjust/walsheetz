syntax = "proto3";

package sui.rpc.v2beta2;

// Transaction argument
message Argument {
  oneof argument {
    uint32 gas_coin = 1;
    uint32 input = 2;
    NestedResult result = 3;
  }
}

message NestedResult {
  optional uint32 cmd = 1;
  optional uint32 result = 2;
}
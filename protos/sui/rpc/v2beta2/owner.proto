syntax = "proto3";

package sui.rpc.v2beta2;

// Owner of an object
message Owner {
  oneof owner {
    string address_owner = 1;
    ObjectOwner object_owner = 2;
    string shared = 3;
    string immutable = 4;
  }
}

message ObjectOwner {
  optional string address = 1;
}
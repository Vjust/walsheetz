syntax = "proto3";

import "google/rpc/status.proto";

package sui.rpc.v2beta2;

// Live data request
message GetLiveDataRequest {
  string query = 1;
  repeated string filters = 2;
}

// Live data response
message LiveDataResponse {
  google.rpc.Status status = 1;
  string data = 2;
  uint64 timestamp = 3;
}

service LiveDataService {
  rpc GetLiveData(GetLiveDataRequest) returns (LiveDataResponse);
}
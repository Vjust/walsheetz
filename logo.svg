<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#4285f4" opacity="0.1"/>
  
  <!-- Spreadsheet grid icon -->
  <g transform="translate(8, 8)">
    <!-- Main spreadsheet rectangle -->
    <rect x="0" y="0" width="24" height="24" rx="2" fill="none" stroke="#4285f4" stroke-width="2"/>
    
    <!-- Horizontal lines -->
    <line x1="0" y1="8" x2="24" y2="8" stroke="#4285f4" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="24" y2="16" stroke="#4285f4" stroke-width="1.5"/>
    
    <!-- Vertical lines -->
    <line x1="8" y1="0" x2="8" y2="24" stroke="#4285f4" stroke-width="1.5"/>
    <line x1="16" y1="0" x2="16" y2="24" stroke="#4285f4" stroke-width="1.5"/>
    
    <!-- Highlighted cell (top-left) -->
    <rect x="0" y="0" width="8" height="8" fill="#4285f4" opacity="0.3"/>
    
    <!-- "W" letter in center -->
    <text x="12" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4285f4" text-anchor="middle">W</text>
  </g>
</svg>
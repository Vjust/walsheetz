version: '3.8'

services:
  unit-tests:
    build:
      context: ..
      dockerfile: Dockerfile.test
    container_name: walsheetz-unit-tests
    volumes:
      # Mount source for hot-reload in watch mode
      - ../frontend:/app/frontend:ro
      - ../blockchain:/app/blockchain:ro
      - ../tests:/app/tests:ro
      - ../vitest.config.js:/app/vitest.config.js:ro
      - ../package.json:/app/package.json:ro
      # Persist test results
      - ./test-results:/app/test-results
      # Persist node_modules to avoid reinstall
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=test
      - VITEST_LOG_LEVEL=verbose
      - FORCE_COLOR=1
      - CI=true
      - LOG_TIMESTAMPS=true
      - LOG_COLORS=true
      - LOG_MOCK_CALLS=true
      - LOG_ASSERTIONS=true
    command: npm run test:run -- --reporter=verbose --reporter=json --outputFile=/app/test-results/test-output.json
    stdin_open: true
    tty: true

volumes:
  node_modules:
